name: Typecheck

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Advisory until the first clean run: the repository had no type check before this job existed.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.1

      # The type packages are installed here, outside the pnpm lockfile, so adding this check cannot affect other jobs.
      - run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts
      - run: npm install --no-save --no-package-lock --no-audit --no-fund --ignore-scripts typescript@5.9.2 @types/react@18 @types/react-dom@18 @types/node@22
      - run: npx tsc --noEmit -p tsconfig.json
