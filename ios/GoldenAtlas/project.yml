name: GoldenAtlas
options:
  bundleIdPrefix: com.goldenatlas
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
configs:
  Debug-Local: debug
  Debug-Staging: debug
  Release: release
configFiles:
  Debug-Local: Config/Debug-Local.xcconfig
  Debug-Staging: Config/Debug-Staging.xcconfig
  Release: Config/Release.xcconfig
packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift.git
    exactVersion: 2.46.0
targets:
  GoldenAtlas:
    type: application
    platform: iOS
    sources:
      - path: GoldenAtlas
        excludes:
          - Resources/Info.plist
    resources:
      - path: GoldenAtlas/Resources
        excludes:
          - Info.plist
    dependencies:
      - package: Supabase
        product: Supabase
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenatlas.ios
        PRODUCT_NAME: Golden Atlas
        INFOPLIST_FILE: GoldenAtlas/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        IPHONEOS_DEPLOYMENT_TARGET: 17.0
        TARGETED_DEVICE_FAMILY: 1
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
  GoldenAtlasTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GoldenAtlasTests]
    dependencies:
      - target: GoldenAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenatlas.ios.tests
        SWIFT_VERSION: 6.0
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Golden Atlas.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Golden Atlas"
        BUNDLE_LOADER: "$(TEST_HOST)"
  GoldenAtlasUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [GoldenAtlasUITests]
    dependencies:
      - target: GoldenAtlas
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goldenatlas.ios.uitests
        SWIFT_VERSION: 6.0
schemes:
  GoldenAtlas-Local:
    build:
      targets:
        GoldenAtlas: all
        GoldenAtlasTests: [test]
        GoldenAtlasUITests: [test]
    run:
      config: Debug-Local
    test:
      config: Debug-Local
      targets:
        - GoldenAtlasTests
        - GoldenAtlasUITests
    archive:
      config: Release
  GoldenAtlas-Staging:
    build:
      targets:
        GoldenAtlas: all
    run:
      config: Debug-Staging
    archive:
      config: Release
